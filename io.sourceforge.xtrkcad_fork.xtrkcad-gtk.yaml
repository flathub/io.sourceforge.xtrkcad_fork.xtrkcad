id: io.sourceforge.xtrkcad_fork.xtrkcad-gtk
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: run-xtrkcad.sh

finish-args:
  - --socket=x11
  - --socket=cups
  - --socket=pulseaudio
  - --share=ipc
  - --device=dri
  - --filesystem=home
  - --env=XTRKCAD_APP_ID=io.sourceforge.xtrkcad_fork.xtrkcad-gtk

modules:
  - name: libzip
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_DOC=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_REGRESS=OFF
      - -DBUILD_TOOLS=OFF
      - -DBUILD_OSSFUZZ=OFF
      - -DBUILD_SHARED_LIBS=OFF
      - -DENABLE_COMMONCRYPTO=OFF
      - -DENABLE_GNUTLS=OFF
      - -DENABLE_MBEDTLS=OFF
      - -DENABLE_OPENSSL=OFF
      - -DENABLE_WINDOWS_CRYPTO=OFF
      - -DENABLE_BZIP2=OFF
      - -DENABLE_LZMA=OFF
      - -DENABLE_ZSTD=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/nih-at/libzip/releases/download/v1.8.0/libzip-1.8.0.tar.gz
        sha256: 30ee55868c0a698d3c600492f2bea4eb62c53849bcf696d21af5eb65f3f3839e
    cleanup:
      - '*'

  - name: fake-inkscape
    buildsystem: simple
    sources:
      - type: script
        dest-filename: inkscape
        commands:
          - |
            rsvg-convert "$@"
    build-commands:
      - install -Dm755 inkscape /app/bin/inkscape
    cleanup:
      - '*'

  - name: xtrkcad
    buildsystem: cmake-ninja
    config-opts:
      - -DXTRKCAD_BUILD_FLATPAK=1
    sources:
      - type: archive
        url: https://download.sourceforge.net/project/xtrkcad-fork/Development/Flatpak/TestSources/source-gtk3-6587.tar.gz
        sha256: 645cec698bf36869579e48a9349c28ee355897b90451b6b9331545e4b5528696
      - type: patch
        paths:
          - patches/about.patch
    builddir: true
